[package]
name = "dabao-console"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
xous-names = { package = "xous-api-names", version = "0.9.71" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
xous = "0.9.70"
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
bao1x-hal = { path = "../../libs/bao1x-hal", features = [
    "std",
], optional = true }
bao1x-api = { path = "../../libs/bao1x-api" }
bao1x-hal-service = { path = "../../services/bao1x-hal-service", optional = true }
bao1x-emu = { path = "../../services/bao1x-emu", optional = true }
usb-bao1x = { path = "../../services/usb-bao1x" }
xous-api-susres = { path = "../../api/xous-api-susres" }

# loadable BIO
keystore = { path = "../../services/keystore", features = ["board-dabao"] }

btc-wallet = { path = "../../libs/btc-wallet", optional = true }

[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x"]
board-dabao = [
    "bao1x-hal-service/board-dabao",
    "bao1x-hal/board-dabao",
    # "bao1x-hal/debug-print-uart",
    "usb-bao1x/board-dabao",
]
ctap-bringup = []
# BIP-32/39/174 P2WPKH hardware wallet, driven entirely over the existing USB-serial shell
# console (see src/cmds/btc_cmd.rs) -- no separate encrypted USB HID transport.
bitcoin-wallet = ["dep:btc-wallet"]

default = ["bitcoin-wallet", "board-dabao", "ctap-bringup"]
